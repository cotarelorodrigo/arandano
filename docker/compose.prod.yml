# Stack de producción. Corre desde /srv/arandano/prod/, sin código
# fuente: sólo este archivo, el .env, el Caddyfile y los volúmenes.
name: arandano-prod

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    cpu_shares: 1024
    mem_limit: 1536m
    # Último candidato del OOM killer: si la máquina se queda sin
    # memoria, que muera cualquier otra cosa antes que la base.
    oom_score_adj: -500
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    image: "arandano-app:${IMAGE_TAG:?IMAGE_TAG es obligatorio}"
    env_file: .env
    environment:
      ARANDANO_STACK: prod
      # Contra qué base tiene que estar hablando esta app. El healthcheck
      # compara current_database() contra esto, así que una DATABASE_URL que
      # apunte al Postgres de dev se reporta como caída en vez de como sana.
      # Va acá y no derivado de DATABASE_URL: derivarlo de la variable que
      # puede estar mal no comprueba nada.
      ARANDANO_DB_ESPERADA: arandano_prod
    # Sin cap de CPU: con cpu_shares alto gana bajo contención y aprovecha
    # los dos cores cuando dev está quieto.
    cpu_shares: 1024
    mem_limit: 1536m
    restart: unless-stopped
    # Sin esto `docker ps` dice "Up" para una app dura y degradada, y nada a
    # nivel contenedor puede reaccionar. `wget` viene en el busybox de
    # node:24-alpine y no necesita root — se verificó que devuelve != 0 con
    # cualquier status que no sea 2xx, así que un 503 del healthcheck marca
    # el contenedor unhealthy en vez de pasar desapercibido.
    # start_period holgado: Next tarda en levantar y un fallo durante el
    # arranque no debe contar como caída.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    cpu_shares: 1024
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      - app

volumes:
  pgdata:
  caddydata:
  caddyconfig:

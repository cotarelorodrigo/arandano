# Stack de producción. Corre desde /srv/arandano/prod/, sin código
# fuente: sólo este archivo, el .env, el Caddyfile y los volúmenes.
name: arandano-prod

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    cpu_shares: 1024
    mem_limit: 1536m
    # Último candidato del OOM killer: si la máquina se queda sin
    # memoria, que muera cualquier otra cosa antes que la base.
    oom_score_adj: -500
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    image: "arandano-app:${IMAGE_TAG:?IMAGE_TAG es obligatorio}"
    env_file: .env
    environment:
      ARANDANO_STACK: prod
      # Contra qué base tiene que estar hablando esta app. El healthcheck
      # compara current_database() contra esto, así que una DATABASE_URL que
      # apunte al Postgres de dev se reporta como caída en vez de como sana.
      # Va acá y no derivado de DATABASE_URL: derivarlo de la variable que
      # puede estar mal no comprueba nada.
      ARANDANO_DB_ESPERADA: arandano_prod
      DOMINIO_BASE: arandano.app
      # PUERTO_PUBLICO NO va acá, a propósito: en producción el sitio se
      # sirve en 443, implícito en `https://`, así que Better Auth arma su
      # `baseURL` sin puerto (lib/auth/origen.ts). Ponerle un default —"443"
      # o cualquier otro— rompería ese `baseURL` en silencio. Ver
      # compose.dev.yml y compose.stage.yml para los stacks donde sí hace
      # falta.
      #
      # BETTER_AUTH_SECRET tampoco aparece acá: llega por `env_file: .env`,
      # igual que DATABASE_URL más arriba, que tampoco se restata en este
      # bloque. Tiene que estar en /srv/arandano/prod/.env antes del próximo
      # deploy que promueva este código — `scripts/verify-infra.sh env`
      # comprueba que exista y que no coincida con el de dev.
      # El check de tenant del healthcheck resuelve este subdominio con
      # resolver_tenant() y comprueba que RLS filtre en las dos direcciones.
      # NO hace falta darlo de alta a mano antes del primer deploy que
      # promueva este código: el paso 14/18 de deploy.sh lo crea contra el
      # objetivo real —prod incluido, es el default de --objetivo— tolerando
      # que ya exista, así que lo da de alta solo la primera vez y no hace
      # nada las siguientes (CLAUDE.md, "el tenant canario"; detalle en
      # docs/runbook-stacks.md, "El tenant canario"). Ese paso existe
      # justamente para evitar el escenario en el que el check de tenant
      # fallaba contra un canario ausente y disparaba el rollback automático
      # de un deploy sano.
      TENANT_CANARIO_SUBDOMINIO: canario
    # Sin cap de CPU: con cpu_shares alto gana bajo contención y aprovecha
    # los dos cores cuando dev está quieto.
    cpu_shares: 1024
    mem_limit: 1536m
    restart: unless-stopped
    # Sin esto `docker ps` dice "Up" para una app dura y degradada, y nada a
    # nivel contenedor puede reaccionar. `wget` viene en el busybox de
    # node:24-alpine y no necesita root — se verificó que devuelve != 0 con
    # cualquier status que no sea 2xx, así que un 503 del healthcheck marca
    # el contenedor unhealthy en vez de pasar desapercibido.
    # start_period holgado: Next tarda en levantar y un fallo durante el
    # arranque no debe contar como caída.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    # Imagen propia: la oficial no trae dns.providers y sin eso no hay wildcard.
    # Tageada por VERSIÓN y no por SHA — la buildea scripts/build-caddy.sh, no
    # deploy.sh. Si este tag y el del script se desincronizan, el stack levanta
    # una imagen vieja sin que nada avise; suite_network lo comprueba.
    image: arandano-caddy:2.11.4-hetzner
    environment:
      # UNA sola variable, nunca el env_file de prod: ese archivo tiene la
      # contraseña de Postgres y el proxy no tiene ninguna razón para verla.
      # Compose la interpola desde el .env del directorio del proyecto.
      #
      # El `:?` hace que el stack se NIEGUE a levantar sin el token, en vez de
      # arrancar sano y fallar recién al renovar dentro de 60 días. Un misconfig
      # tiene que doler ahora, no en dos meses.
      HETZNER_DNS_TOKEN: ${HETZNER_DNS_TOKEN:?falta HETZNER_DNS_TOKEN en /srv/arandano/prod/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    cpu_shares: 1024
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      - app

volumes:
  pgdata:
  caddydata:
  caddyconfig:

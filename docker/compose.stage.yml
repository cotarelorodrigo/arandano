# Stack de staging: corre la imagen ya buildeada contra un Postgres
# efímero. Empezar siempre de un estado conocido es justamente lo que
# valida una migración — por eso no comparte la base de dev.
name: arandano-stage

services:
  postgres:
    image: postgres:17-alpine
    # Credenciales en claro en un archivo versionado, a propósito y sólo acá:
    # esta base vive en tmpfs, se crea vacía en cada corrida y desaparece al
    # parar el contenedor, nunca ve datos de clientes, y el stack sólo escucha
    # en la IP de Tailscale. No hay secreto que proteger.
    # OJO SI SE COPIA ESTE ARCHIVO COMO PLANTILLA: en dev y en prod las
    # credenciales van por env_file (.env.dev y /srv/arandano/prod/.env),
    # nunca inline. Lo que hace esto aceptable es que la base sea efímera, no
    # que sea cómodo.
    #
    # PERO ESTE `environment:` INLINE NO ES SÓLO ESTÉTICA: este postgres NO
    # DEBE LEER NINGÚN .env, y menos uno compartido con el servicio `app`.
    # deploy.sh promueve reescribiendo IMAGE_TAG en el .env del stack; si
    # postgres leyera ese mismo archivo, IMAGE_TAG entraría también en SU
    # entorno computado, Compose lo vería driftado respecto del contenedor vivo
    # y lo RECREARÍA al levantar `app` — aunque el comando no diga
    # `--force-recreate`. Eso es exactamente el bug que el ensayo completo
    # encontró en el paso 13 de deploy.sh (ver el comentario largo de ahí, con
    # las cuatro mediciones), y ahí se contiene con `--no-deps`.
    #
    # El paso 8 de deploy.sh levanta este stack con `up -d --wait app`, SIN
    # `--no-deps` — a propósito, porque acá sí hace falta que Compose levante
    # la base. Lo único que hace que eso sea seguro es esta ausencia de
    # env_file. Ponerle uno reintroduce el bug en una línea que no tiene
    # ninguna defensa.
    environment:
      POSTGRES_USER: arandano_stage
      POSTGRES_PASSWORD: efimero-no-persiste
      POSTGRES_DB: arandano_stage
      # PGDATA en un subdirectorio del tmpfs: el entrypoint lo crea y le
      # pone el owner correcto. Montar el tmpfs directamente en el
      # directorio de datos lo deja como root y initdb falla.
      PGDATA: /var/lib/postgresql/data/pgdata
    # El tmpfs queda deliberadamente por debajo de mem_limit (320m vs
    # 512m): las páginas de tmpfs se cargan contra la memoria del cgroup y
    # no son "page cache" descartable, así que cuentan 1:1 contra el
    # límite. Encima, Postgres necesita memoria propia además del dato en
    # sí — shared_buffers (respaldado por /dev/shm, otro tmpfs del mismo
    # cgroup), work_mem por conexión y el overhead de cada backend. Sin
    # ese margen, el cgroup mata al contenedor por OOM antes de llenar el
    # tmpfs, y ese gate fallaría por falta de memoria, no porque la
    # migración sea insegura. No igualar este valor a mem_limit.
    tmpfs:
      - /var/lib/postgresql/data:size=320m,mode=1777
    cpus: 0.25
    cpu_shares: 128
    mem_limit: 512m
    healthcheck:
      # Mismas variables que dev y prod: si alguien cambia POSTGRES_USER o
      # POSTGRES_DB arriba, el healthcheck lo sigue en vez de quedar probando
      # un usuario que ya no existe.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: "arandano-app:${IMAGE_TAG:?IMAGE_TAG es obligatorio}"
    environment:
      ARANDANO_STACK: stage
      # Los roles de este stack NO existen hasta que deploy.sh corra
      # scripts/setup-db-roles.sh contra este Postgres: es efímero y nace
      # vacío en cada corrida. Hasta que exista deploy.sh, levantar este stack
      # a mano deja la app sin poder conectarse, y es lo esperado.
      DATABASE_URL: postgres://arandano_app:efimero-app@postgres:5432/arandano_stage
      MIGRATE_DATABASE_URL: postgres://arandano_owner:efimero-owner@postgres:5432/arandano_stage
      # Ver compose.prod.yml: el healthcheck comprueba contra qué base está
      # hablando la app, no sólo que alguna responda.
      ARANDANO_DB_ESPERADA: arandano_stage
      # La base de la API de Kapso (la capa de WhatsApp del bot). No es secreta;
      # la credencial es KAPSO_API_KEY y este stack NO la tiene: la pantalla
      # /bot degrada avisando y devuelve 200, que es lo que el barrido de
      # scripts/smoke.sh necesita para no voltear el deploy.
      KAPSO_API_BASE_URL: https://api.kapso.ai
      DOMINIO_BASE: stage.arandano.app
      # El puerto con el que se llega a este stack (ver el mapeo de `ports`
      # más abajo): Better Auth lo necesita para armar su `baseURL`
      # (lib/auth/origen.ts). Ver compose.dev.yml para el porqué completo, y
      # compose.prod.yml para por qué prod NO define esta variable.
      PUERTO_PUBLICO: "3001"
      # Secreto de firma de Better Auth, inline por el mismo motivo que las
      # credenciales de arriba: este Postgres es efímero, nace vacío en cada
      # corrida, nunca ve datos de clientes, y el stack sólo escucha en la IP
      # de Tailscale. No hay secreto que proteger.
      BETTER_AUTH_SECRET: efimero-secreto-no-persiste
      # El check de tenant del healthcheck resuelve este subdominio con
      # resolver_tenant() y comprueba que RLS filtre en las dos direcciones.
      # El paso 8 de deploy.sh crea este canario contra la base efímera de
      # stage en cada corrida, antes de este `up -d --wait app`.
      TENANT_CANARIO_SUBDOMINIO: canario
      # Token en claro en un archivo versionado, por el mismo motivo que las
      # credenciales de este stack unas líneas más arriba: la base es efímera,
      # nace vacía en cada corrida, nunca ve datos de clientes, y el stack sólo
      # escucha en la IP de Tailscale. No hay secreto que proteger.
      # OJO: este literal está DUPLICADO en scripts/deploy.sh, que se lo pasa a
      # smoke.sh. Si cambia acá, cambia allá — igual que efimero-app y
      # efimero-owner, que ya viven así.
      ARANDANO_SALUD_TOKEN: efimero-salud
    ports:
      - "100.64.81.63:3001:3000"
    cpus: 0.5
    cpu_shares: 128
    mem_limit: 768m
    # Sin esto, `docker compose up --wait` vuelve cuando el contenedor está
    # CORRIENDO, no cuando la app atiende — y el smoke test de deploy.sh
    # correría contra un Next que todavía está arrancando, produciendo fallas
    # intermitentes del gate que parecen bugs del código. Con healthcheck,
    # `--wait` espera a que /api/health conteste 200.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

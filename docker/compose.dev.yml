# Stack de desarrollo. Escucha SOLO en la IP de Tailscale: Docker escribe
# reglas de iptables que se saltean ufw, así que el bind explícito es la
# defensa real, no el firewall.
name: arandano-dev

services:
  postgres:
    image: postgres:17-alpine
    env_file: ../.env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "100.64.81.63:5433:5432"
    cpus: 0.25
    cpu_shares: 256
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: node:24-alpine
    working_dir: /app
    # node_modules es un volumen que persiste entre `up`s, así que un simple
    # "¿existe el directorio?" nunca vuelve a reinstalar aunque cambie el
    # lockfile: dev arrancaría en silencio con dependencias desactualizadas.
    # En vez de eso, guardamos el hash del lockfile instalado dentro del
    # propio volumen y sólo corremos `npm ci` cuando no coincide; el hash
    # se graba recién si `npm ci` termina bien, para que una instalación
    # interrumpida no quede marcada como "hecha".
    command: |
      sh -c '
        hash=$$(sha256sum package-lock.json | cut -d" " -f1)
        stored=$$(cat node_modules/.arandano-lock-hash 2>/dev/null)
        if [ "$$hash" != "$$stored" ]; then
          npm ci && echo "$$hash" > node_modules/.arandano-lock-hash
        fi
        exec npm run dev
      '
    env_file: ../.env.dev
    environment:
      ARANDANO_STACK: dev
      HOSTNAME: 0.0.0.0
      # Ver compose.prod.yml: el healthcheck comprueba contra qué base está
      # hablando la app, no sólo que alguna responda.
      ARANDANO_DB_ESPERADA: arandano_dev
      DOMINIO_BASE: dev.arandano.app
      # El número de WhatsApp del negocio, en formato internacional sin "+" ni
      # espacios (ej. 5491155555555): es lo que come wa.me. Vacío a propósito
      # todavía — no existe el número real, y uno inventado manda a alguien al
      # WhatsApp de un desconocido. Completar antes del primer deploy con el
      # número real.
      WHATSAPP_CONTACTO: "5491132672973"
      # La base de la API de Kapso, que es la capa de WhatsApp del bot. No es
      # secreta —la credencial es KAPSO_API_KEY y viaja por `env_file`—, así que
      # va inline: tenerla acá permite además apuntarla a un mock sin tocar el
      # `.env` del servidor.
      KAPSO_API_BASE_URL: https://api.kapso.ai
      # Con qué origen se registra el webhook del bot en Kapso.
      #
      # Kapso llama desde internet y este stack escucha SÓLO en la IP de
      # Tailscale, así que sin un túnel público no hay forma de recibir un
      # mensaje en dev. Vacío = se deriva del subdominio real (lo correcto en
      # prod); con valor, `{sub}` se reemplaza por el subdominio del tenant.
      # Ejemplo con un túnel: https://{sub}.mi-tunel.ngrok.app
      BOT_WEBHOOK_BASE_URL: ""
      # El puerto con el que el navegador llega a este stack — dev publica la
      # app en :3000 (ver el mapeo de `ports` más abajo). Better Auth lo
      # necesita para armar su `baseURL` (lib/auth/origen.ts): en producción
      # 443 es implícito en `https://` y esta variable queda SIN DEFINIR ahí
      # a propósito (ver compose.prod.yml) — ponerle un default acá que se
      # copiara sin pensar rompería el `baseURL` de prod en silencio.
      PUERTO_PUBLICO: "3000"
      # El check de tenant del healthcheck resuelve este subdominio con
      # resolver_tenant() y comprueba que RLS filtre en las dos direcciones.
      # El canario de dev se creó a mano con `npm run tenant:crear` (Task 4).
      TENANT_CANARIO_SUBDOMINIO: canario
      # Token en claro en un archivo versionado, con el mismo razonamiento que
      # las credenciales inline de compose.stage.yml: dev nunca ve datos de
      # clientes (seed sintético, CLAUDE.md) y sólo escucha en la IP de
      # Tailscale, así que no hay secreto que proteger.
      #
      # Sin esto, `scripts/verify-infra.sh app` no puede pedir el nivel
      # detallado del healthcheck y sus checks quedan mirando un cuerpo
      # `{"status":"ok"}` — que es exactamente cómo esa suite quedó en rojo
      # cuando /api/health pasó a tener dos niveles.
      #
      # Literal DISTINTO del de stage (`efimero-salud`) a propósito: son dos
      # stacks distintos, y un token compartido entre entornos entrena a
      # copiarlo también al que sí tiene datos de clientes.
      ARANDANO_SALUD_TOKEN: dev-salud-no-es-secreto
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
    ports:
      - "100.64.81.63:3000:3000"
    cpus: 0.75
    cpu_shares: 256
    mem_limit: 1536m
    # Sin restart a propósito: en dev un crash tiene que verse, no
    # esconderse detrás de un reinicio automático.
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:

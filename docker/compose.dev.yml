# Stack de desarrollo. Escucha SOLO en la IP de Tailscale: Docker escribe
# reglas de iptables que se saltean ufw, así que el bind explícito es la
# defensa real, no el firewall.
name: arandano-dev

services:
  postgres:
    image: postgres:17-alpine
    env_file: ../.env.dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "100.64.81.63:5433:5432"
    cpus: 0.25
    cpu_shares: 256
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: node:24-alpine
    working_dir: /app
    # node_modules es un volumen que persiste entre `up`s, así que un simple
    # "¿existe el directorio?" nunca vuelve a reinstalar aunque cambie el
    # lockfile: dev arrancaría en silencio con dependencias desactualizadas.
    # En vez de eso, guardamos el hash del lockfile instalado dentro del
    # propio volumen y sólo corremos `npm ci` cuando no coincide; el hash
    # se graba recién si `npm ci` termina bien, para que una instalación
    # interrumpida no quede marcada como "hecha".
    command: |
      sh -c '
        hash=$$(sha256sum package-lock.json | cut -d" " -f1)
        stored=$$(cat node_modules/.arandano-lock-hash 2>/dev/null)
        if [ "$$hash" != "$$stored" ]; then
          npm ci && echo "$$hash" > node_modules/.arandano-lock-hash
        fi
        exec npm run dev
      '
    env_file: ../.env.dev
    environment:
      ARANDANO_STACK: dev
      HOSTNAME: 0.0.0.0
      # Ver compose.prod.yml: el healthcheck comprueba contra qué base está
      # hablando la app, no sólo que alguna responda.
      ARANDANO_DB_ESPERADA: arandano_dev
      DOMINIO_BASE: dev.arandano.app
      # El check de tenant del healthcheck resuelve este subdominio con
      # resolver_tenant() y comprueba que RLS filtre en las dos direcciones.
      # El canario de dev se creó a mano con `npm run tenant:crear` (Task 4).
      TENANT_CANARIO_SUBDOMINIO: canario
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
    ports:
      - "100.64.81.63:3000:3000"
    cpus: 0.75
    cpu_shares: 256
    mem_limit: 1536m
    # Sin restart a propósito: en dev un crash tiene que verse, no
    # esconderse detrás de un reinicio automático.
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  node_modules:
